<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19;border-radius:16px;overflow:hidden;">
  <defs>
    <!-- Background Linear Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .glow-orb {
      transform-origin: center;
      animation: pulseOrb 8s ease-in-out infinite alternate;
    }
    .flow-wave {
      animation: floatWave 12s ease-in-out infinite alternate;
    }
    .status-pulse {
      animation: blink 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    .pill-hover {
      transition: transform 0.3s ease;
    }
    @keyframes pulseOrb {
      0% { transform: scale(0.9) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.65; }
      100% { transform: scale(0.95) translate(-15px, 15px); opacity: 0.4; }
    }
    @keyframes floatWave {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-18px) rotate(1deg); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.92); }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- Grid Overlay -->
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Animated Ambient Gradient Glows (Dynamic background only) -->
  <g class="flow-wave">
    <circle cx="200" cy="80" r="160" fill="#38bdf8" opacity="0.18" filter="url(#glow)" class="glow-orb" />
    <circle cx="1020" cy="180" r="190" fill="#818cf8" opacity="0.2" filter="url(#glow)" class="glow-orb" style="animation-delay:-3s;" />
    <circle cx="600" cy="320" r="140" fill="#c084fc" opacity="0.12" filter="url(#glow)" class="glow-orb" style="animation-delay:-5s;" />
  </g>

  <!-- Flow Circuit Graphic Lines in Background -->
  <g opacity="0.25">
    <path d="M 0 100 Q 300 180 600 90 T 1200 120" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,6" />
    <path d="M 0 280 Q 400 200 800 290 T 1200 230" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="8,8" />
  </g>

  <!-- Foreground Main Card Container -->
  <g transform="translate(60, 40)">
    
    <!-- Top Status Pill -->
    <g transform="translate(0, 0)">
      <rect width="270" height="34" rx="17" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="18" cy="17" r="5" fill="#10b981" class="status-pulse" />
      <circle cx="18" cy="17" r="9" fill="none" stroke="#10b981" stroke-width="1" opacity="0.5" class="status-pulse" />
      <text x="36" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1">
        CURATED QA ARCHITECTURE
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5">
      Awesome QA &amp; Test Case Management
    </text>

    <!-- Subtitle -->
    <text x="0" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
      Top SaaS Platforms &amp; Open-Source Alternatives • Test Authoring, Execution &amp; CI/CD Pipelines
    </text>

    <!-- Interactive Badges / Capability Pills -->
    <g transform="translate(0, 185)">
      
      <!-- Pill 1: SaaS Leaders -->
      <g transform="translate(0, 0)">
        <rect width="200" height="42" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.2" />
        <circle cx="24" cy="21" r="7" fill="#38bdf8" />
        <text x="42" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">
          SaaS &amp; Enterprise
        </text>
      </g>

      <!-- Pill 2: Open Source -->
      <g transform="translate(216, 0)">
        <rect width="210" height="42" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.2" />
        <circle cx="24" cy="21" r="7" fill="#10b981" />
        <text x="42" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">
          Self-Hosted &amp; OSS
        </text>
      </g>

      <!-- Pill 3: Traceability -->
      <g transform="translate(442, 0)">
        <rect width="210" height="42" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.2" />
        <circle cx="24" cy="21" r="7" fill="#c084fc" />
        <text x="42" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">
          Jira &amp; Traceability
        </text>
      </g>

      <!-- Pill 4: Automation & AI -->
      <g transform="translate(668, 0)">
        <rect width="220" height="42" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.2" />
        <circle cx="24" cy="21" r="7" fill="#f59e0b" />
        <text x="42" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">
          AI &amp; CI/CD Testing
        </text>
      </g>

    </g>

    <!-- Bottom Feature Matrix Highlights Bar -->
    <g transform="translate(0, 252)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#64748b">
        ⚡ Featuring TestRail • Zephyr • Xray • Qase • BrowserStack • Kiwi TCMS • TestLink • FitNesse • UnitTCMS • TMT
      </text>
    </g>

  </g>
</svg>